name: Verify OpsPilot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev pytest
      - name: Demo services
        working-directory: sample-services
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev pytest
      - name: Web workspace
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable release
        run: |
          ./deploy/init-env.sh local
      - name: Build and start release
        run: docker compose --env-file .env.preview -p opspilot-ci -f docker-compose.yml -f compose.release.yml up -d --build --wait --wait-timeout 180
      - name: Check migration drift
        run: docker compose --env-file .env.preview -p opspilot-ci -f docker-compose.yml -f compose.release.yml exec -T api alembic check
      - name: Run incident and recovery smoke test
        run: docker compose --env-file .env.preview -p opspilot-ci -f docker-compose.yml -f compose.release.yml exec -T api python - < deploy/smoke.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.preview -p opspilot-ci -f docker-compose.yml -f compose.release.yml logs --tail=80
      - name: Remove disposable release
        if: always()
        run: docker compose --env-file .env.preview -p opspilot-ci -f docker-compose.yml -f compose.release.yml down -v
